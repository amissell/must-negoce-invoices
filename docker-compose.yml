version: '3.8'

services:
  # PHP & Laravel Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: must_negoce_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    networks:
      - must_negoce_network
    depends_on:
      - mysql

  # Nginx Web Server
  nginx:
    image: nginx:alpine
    container_name: must_negoce_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - must_negoce_network
    depends_on:
      - app

  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: must_negoce_mysql
    restart: always
    environment:
      MYSQL_DATABASE: must-negoce-invoices
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_USER: laravel
      MYSQL_PASSWORD: laravelpassword
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3307:3306"
    networks:
      - must_negoce_network

  # phpMyAdmin (Optional - for easy database management)
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: must_negoce_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: must_negoce_mysql
      PMA_USER: root
      PMA_PASSWORD: rootpassword
    ports:
      - "8081:80"
    networks:
      - must_negoce_network
    depends_on:
      - mysql

networks:
  must_negoce_network:
    driver: bridge

volumes:
  mysql_data:
    driver: local